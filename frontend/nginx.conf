server {
    listen      80;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # Patient documents are uploaded through the API. nginx's 1 MB default
    # rejects most scans and PDFs before they ever reach the backend.
    client_max_body_size 25m;

    gzip             on;
    gzip_types       text/css application/javascript application/json image/svg+xml;
    gzip_min_length  1024;

    # ── API ───────────────────────────────────────────────────
    # Proxying rather than letting the browser call the backend port directly
    # is what makes the API same-origin. That removes CORS entirely and keeps
    # the frontend bundle free of any environment-specific host.
    #
    # No trailing slash on proxy_pass: the original URI is forwarded intact,
    # so /api/v1/patients reaches the backend as /api/v1/patients.
    location /api/v1 {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # Report generation and bulk exports outrun the 60s default.
        proxy_read_timeout 120s;
    }

    # ── Uploaded patient documents ────────────────────────────
    # Served by the backend from its uploads volume. Several pages build this
    # URL as VITE_API_URL.replace('/api/v1',''), which with a relative base
    # evaluates to '' — giving /uploads/... on this same origin.
    location /uploads {
        proxy_pass       http://backend:8000;
        proxy_set_header Host $host;
    }

    # Vite emits content-hashed filenames, so these can never go stale.
    location /assets {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # react-router owns every remaining path; a deep link must still serve the
    # app shell rather than a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
